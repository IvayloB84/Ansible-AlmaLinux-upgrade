name: Ansible Syntax Verification Check

on: [push, pull_request]

jobs:
  validate-playbook:
    runs-on: ubuntu-latest
    strategy:
      # Tests both playbooks simultaneously in separate parallel environments
      matrix:
        playbook: 
          - playbook_RH_migration_8_9.yml
          - playbook_RH_migration_9_10.yml
    steps:
      - name: 1. Pull down the updated code from the repository
        uses: actions/checkout@v7

      - name: 2. Set up the Python background ecosystem
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: 3. Install the core Ansible engine
        run: |
          pip install --upgrade pip
          pip install ansible

      - name: 4. Perform a dry-run syntax verification check
        run: |
          # The matrix variable inserts the current playbook name dynamically
          ansible-playbook ${{ matrix.playbook }} --syntax-check
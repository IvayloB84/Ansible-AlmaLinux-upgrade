---
# =========================================================================
# STEP 1: Import and run the second playbook first
# =========================================================================
- import_playbook: 4067471_predictable-nics_3.yml

- name: ELevate AlmaLinux 8 to 9 on Cloud VMs
  hosts: all
  become: true

  vars:
    upgrade_source_major: "8"
    upgrade_target_major: "9"

  tasks:
    - name: Force remove old corrupted repository files
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      become: true
      loop:
        - /etc/yum.repos.d/elevate.repo
        - /etc/yum.repos.d/epel.repo
        - /etc/yum.repos.d/epel-modular.repo
        - /etc/yum.repos.d/epel-testing.repo
        - /etc/yum.repos.d/epel-testing-modular.repo
        - /var/cache/dnf
        - /tmp/elevate-release.rpm

    # =========================================================================
    # MAIN ALMALINUX 8 TO 9 MIGRATION ENGINE
    # =========================================================================
    - name: Execute AlmaLinux 8 to 9 Migration Pipeline
      when: ansible_distribution_major_version == upgrade_source_major
      block:
        - name: 2. Run a full system update to latest packages
          ansible.builtin.shell: "dnf update -y"
          register: dnf_update
          changed_when: "'Nothing to do' not in dnf_update.stdout"

        # ---------------------------------------------------------------------
        # These steps are no longer needed because from RedHad provided fix 4067471_predictable-nics_3.yml and they can be skipped.
        # If you need to use them for some reason and need the script you can find it in the scripts/ folder.
        # CONDITIONAL NETWORK MIGRATION BLOCK (SPEED-OPTIMISED WITH IDEMPOTENCY)
        # ---------------------------------------------------------------------
        # - name: 2a. Check if network interface migration has already been executed
        #   ansible.builtin.stat:
        #     path: /etc/systemd/network/10-enp0s0.link
        #   register: network_migration_done

        # - name: 2b. Stage the network migration script
        #   ansible.builtin.copy:
        #     src: "scripts/network_name_migration.sh"
        #     dest: /tmp/network_name_migration.sh
        #     mode: "0755"
        #   when: not network_migration_done.stat.exists

        # - name: 2c. Migrate legacy network interfaces to NetworkManager asynchronously
        #   ansible.builtin.shell: /bin/bash /tmp/network_name_migration.sh
        #   async: 120
        #   poll: 0
        #   register: network_migration_async
        #   when: not network_migration_done.stat.exists

        # - name: 2d. Wait for the network connection to recover
        #   ansible.builtin.wait_for_connection:
        #     delay: 5
        #     timeout: 90
        #   when: not network_migration_done.stat.exists and network_migration_async.ansible_job_id is defined

        # - name: 2e. Remove the temporary migration script
        #   ansible.builtin.file:
        #     path: /tmp/network_name_migration.sh
        #     state: absent
        #   when: not network_migration_done.stat.exists

        - name: 3a. Copy the remediation engine script onto the guest filesystem
          ansible.builtin.copy:
            src: scripts/leapp_auto_remediate.sh
            dest: /tmp/leapp_auto_remediate.sh
            mode: "0755"

        - name: 3b. Force run the remediation script natively via raw system shell
          ansible.builtin.shell: "/tmp/leapp_auto_remediate.sh"
          args:
            executable: /bin/bash
          become: true

        - name: 3c. Remove the remediation script
          ansible.builtin.file:
            path: /tmp/leapp_auto_remediate.sh
            state: absent

        # ---------------------------------------------------------------------
        # SYSTEM PREPARATION STEPS
        # ---------------------------------------------------------------------
        - name: 4. Reboot if updates were installed
          ansible.builtin.reboot:
            reboot_timeout: 300
          when: dnf_update.changed

        - name: 5a. Comment synced vagrant local project directory
          ansible.builtin.lineinfile:
            path: /etc/fstab
            regexp: '^#?(\s*vagrant\s+/vagrant\s+vboxsf.*)'
            line: '#\1'
            backrefs: true
          register: fstab_change
          when: ansible_distribution_major_version == upgrade_source_major

        - name: 5b. Unmount vboxsf filesystems if fstab changed
          ansible.posix.mount:
            path: /vagrant
            state: unmounted
            when:
            - ansible_distribution_major_version == upgrade_source_major              
            - fstab_change.changed
          failed_when: false

        # =========================================================================
        # MAIN ALMALINUX 8 TO 9 MIGRATION ENGINE
        # =========================================================================
        - name: 6a. Install official ELevate repository for AlmaLinux 9
          ansible.builtin.shell: "dnf install -y http://repo.almalinux.org/elevate/elevate-release-latest-el$(rpm --eval %rhel).noarch.rpm"
          
        - name: 6b. Install Leapp upgrade packages and AlmaLinux data
          ansible.builtin.shell: "dnf install -y leapp-upgrade leapp-data-almalinux"
          register: leapp_install
          changed_when: "'Nothing to do' not in leapp_install.stdout"

        # Uncomment these lines if you want to continue using network_name_migration.sh form scripts/ folder.
        # - name: 7. Disable setup link rules
        #   ansible.builtin.file:
        #     src: /dev/null
        #     dest: /etc/udev/rules.d/80-net-setup-link.rules
        #     state: link
        #     force: true

        - name: 8 Pre-confirm the VDO and PAM checks required by Leapp
          ansible.builtin.shell: |
            leapp answer --section check_vdo.confirm=True
            leapp answer --section remove_pam_pkcs11_module_check.confirm=True
          failed_when: false

        - name: 9. Set environment variables to bypass common SSH/Driver inhibitors
          ansible.builtin.lineinfile:
            path: /etc/environment
            line: "LEAPP_UNSUPPORTED=1 LEAPP_DEVEL_SKIP_CHECK_VDO=1 LEAPP_SKIP_ASSETS_CHECK=1"
            state: present

        # ---------------------------------------------------------------------
        # LEAPP MIGRATION WORKFLOW
        # ---------------------------------------------------------------------
        - name: 10. Remove custom overridden data files
          ansible.builtin.file:
            path: /etc/leapp/files/device_driver_deprecation_data.json
            state: absent

        - name: 11. Force reinstall official leapp data packages to restore original streams
          ansible.builtin.shell: "dnf reinstall -y leapp-upgrade leapp-data-almalinux"
          become: true

        - name: 12a. Run Leapp pre-upgrade analysis
          ansible.builtin.command: /bin/leapp preupgrade
          environment:
            LEAPP_UNSUPPORTED: "1"
            LEAPP_DEVEL_TARGET_PRODUCT: "AlmaLinux"
            LEAPP_TARGET_PRODUCT_VERSION: "9"
          register: preupgrade_result
          ignore_errors: true
          changed_when: false

        - name: 12b.Display pre-upgrade scan console output metrics
          ansible.builtin.debug:
            msg: "{{ (preupgrade_result.stdout | regex_search('(?s)(Debug output written to.*|UPGRADE INHIBITORS.*)') | default('Summary block not found.', true)).split('\n') }}"

        - name: 12c. Check if pre-upgrade failed due to critical inhibitors
          ansible.builtin.fail:
            msg: >
              Leapp pre-upgrade failed due to a hard inhibitor blocker!
              Review /var/log/leapp/leapp-report.txt on the remote host.
              ---------------------------------------------------------
              STDOUT PAYLOAD: {{ preupgrade_result.stdout }}
              STDERR PAYLOAD: {{ preupgrade_result.stderr }}
          # FIX: Only fail if an actual blocker keyword shows up in the summary blocks
          when: >
            (preupgrade_result.stdout is search('UPGRADE INHIBITED')) or
            (preupgrade_result.stderr is search('UPGRADE INHIBITED')) or
            (preupgrade_result.stdout is search('inhibitor: yes')) or
            (preupgrade_result.stderr is search('inhibitor: yes'))

        - name: 13a. Trigger the ELevate upgrade package preparation phase
          ansible.builtin.command: /bin/leapp upgrade
          environment:
            LEAPP_UNSUPPORTED: "1"
            LEAPP_DEVEL_TARGET_PRODUCT: "AlmaLinux"
            # Optional: Add minor version if your data files require strict matching (e.g., "9.4")
            LEAPP_TARGET_PRODUCT_VERSION: "9" 
          changed_when: true

        - name: 13b. Initiate migration reboot and wait for AlmaLinux 9 conversion
          ansible.builtin.reboot:
            reboot_timeout: 2700  # 45 minutes max timeout for the entire RPM swap
            connect_timeout: 30
            msg: "Ansible initiating controlled ELevate transaction upgrade reboot."

        # =========================================================================
        # STEP 5: POST-UPGRADE VALIDATION ENGINE
        # =========================================================================
        - name: 14a Force Ansible to refresh system information
          ansible.builtin.setup:

        - name: 14b. Validate that the system has successfully upgraded to major version 9
          ansible.builtin.assert:
            that:
              - ansible_distribution_major_version == upgrade_target_major
              - ansible_distribution == "AlmaLinux"
            fail_msg: "Upgrade validation failed! System is reporting version {{ ansible_distribution_version }} instead of AlmaLinux 9."
            success_msg: "Success! Verified target machine is now actively running {{ ansible_distribution_version }}."

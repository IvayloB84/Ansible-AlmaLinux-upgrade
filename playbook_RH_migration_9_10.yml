---
# =========================================================================
# STEP 1: Import and run the second playbook first
# =========================================================================
- import_playbook: 4067471_predictable-nics_3.yml

- name: ELevate AlmaLinux 9 to 10 on Cloud VMs
  hosts: all
  become: true

  vars:
    ansible_python_interpreter: /usr/bin/python3.9
    upgrade_source_major: "9"
    upgrade_target_major: "10"

  tasks:
    - name: Force remove old corrupted repository files
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/yum.repos.d/elevate.repo
        - /etc/yum.repos.d/epel.repo
        - /etc/yum.repos.d/epel-modular.repo
        - /etc/yum.repos.d/epel-testing.repo
        - /etc/yum.repos.d/epel-testing-modular.repo
        - /var/cache/dnf
        - /tmp/elevate-release.rpm

    # =========================================================================
    # MAIN ALMALINUX 9 TO 10 MIGRATION ENGINE
    # =========================================================================
    - name: 1. Flush stale repository files, metadata structures, and lift locks
      ansible.builtin.shell: |
        dnf remove -y leapp leapp-upgrade leapp-data-almalinux elevate-release 2>/dev/null || true     
        sed -i '/^exclude=.*/d' /etc/yum.conf /etc/dnf/dnf.conf 2>/dev/null || true
        rm -f /etc/yum.repos.d/epel*.repo /etc/yum.repos.d/almalinux-devel.repo /etc/yum.repos.d/almalinux.repo 2>/dev/null || true
        # Force cache synchronization reset
        dnf clean all
      changed_when: true

    - name: Execute AlmaLinux 9 to 10 Migration Pipeline
      when: ansible_distribution_major_version == upgrade_source_major
      block:
        - name: 2. Run a full system update to latest packages
          ansible.builtin.shell: "yum update -y"
          register: dnf_update
          changed_when: "'Nothing to do' not in dnf_update.stdout"

        # =========================================================================
        # REPOSITORY CONFIGURATION & PLATFORM STAGING
        # =========================================================================
        - name: 3a. Telemetry Check Profile disk space usage BEFORE cleanup
          ansible.builtin.shell: "df -h / /boot /var"
          register: space_before

        - name: 3b. Display baseline storage allocation matrix
          ansible.builtin.debug:
            msg: "{{ space_before.stdout_lines }}"

        - name: 3c. Force purge custom python312 package via direct system shell
          ansible.builtin.shell: "dnf remove -y custom-python312 python312 || true"
          changed_when: true

        - name: 3d. Hard wipe residual unmanaged site-package filesystem directories
          ansible.builtin.file:
            path: "{{ item }}"
            state: absent
          loop:
            - /usr/lib64/python3.12
            - /usr/lib/python3.12

        - name: 3e. Telemetry Check Profile disk space usage AFTER cleanup
          ansible.builtin.shell: "df -h / /boot /var"
          register: space_after

        - name: 3f. Display reclaimed storage allocation matrix
          ansible.builtin.debug:
            msg: "{{ space_after.stdout_lines }}"

        # ---------------------------------------------------------------------
        # CONDITIONAL NETWORK MIGRATION BLOCK (SPEED-OPTIMISED WITH IDEMPOTENCY)
        # ---------------------------------------------------------------------
        # - name: 11a. Check if network interface migration has already been executed
        #   ansible.builtin.stat:
        #     path: /etc/systemd/network/10-enp0s0.link
        #   register: network_migration_done

        # - name: 11b. Stage the network migration script
        #   ansible.builtin.copy:
        #     src: "scripts/network_name_migration.sh"
        #     dest: /tmp/network_name_migration.sh
        #     mode: "0755"
        #   when: not network_migration_done.stat.exists

        # - name: 11c. Migrate legacy network interfaces to NetworkManager asynchronously
        #   ansible.builtin.shell: /bin/bash /tmp/network_name_migration.sh
        #   async: 120
        #   poll: 0
        #   register: network_migration_async
        #   when: not network_migration_done.stat.exists

        # - name: 11d. Wait for the network connection to recover
        #   ansible.builtin.wait_for_connection:
        #     delay: 5
        #     timeout: 90
        #   when: not network_migration_done.stat.exists and network_migration_async.ansible_job_id is defined

        # - name: 11e. Remove the temporary migration script
        #   ansible.builtin.file:
        #     path: /tmp/network_name_migration.sh
        #     state: absent
        #   when: not network_migration_done.stat.exists

        # ---------------------------------------------------------------------
        # SYSTEM PREPARATION STEPS
        # ---------------------------------------------------------------------
        - name: 4. Reboot if updates were installed
          ansible.builtin.reboot:
            reboot_timeout: 300
          when: dnf_update.changed

        - name: 5a. Force comment out vagrant vboxsf mount points to prevent boot crash
          ansible.builtin.replace:
            path: /etc/fstab
            regexp: '^([^#]*vagrant.*vboxsf.*)$'
            replace: '# \1'
          register: fstab_change

        - name: 5b. Unmount vboxsf filesystem right before leapp initialization
          ansible.builtin.shell: "umount -a -t vboxsf || true && systemctl daemon-reload"
          when: fstab_change.changed

        - name: 6a. Install native ELevate repository
          ansible.builtin.shell: "dnf install -y http://repo.almalinux.org/elevate/elevate-release-latest-el$(rpm --eval %rhel).noarch.rpm"

        - name: 6b. Install Leapp upgrade packages and AlmaLinux data
          ansible.builtin.shell: "dnf install -y leapp-upgrade leapp-data-almalinux"
          register: leapp_install
          changed_when: "'Nothing to do' not in leapp_install.stdout"

        - name: 7. Inject standard automated upgrade verification answerfile
          ansible.builtin.copy:
            content: |
              [remove_pam_userdb]
              confirm = true
              [check_vdo]
              confirm = true
              [unsupported_upgrade_unverified_packages]
              confirm = true
            dest: /var/log/leapp/answerfile
            mode: '0600'

        # =========================================================================
        # PLATFORM STAGING: CLEANUP & BOOT TARGET ALIGNMENT
        # =========================================================================
        - name: 8. Purge deprecated Xorg graphic packages to satisfy Alma10 baseline
          ansible.builtin.shell: |
            yum remove -y "xorg-x11-server*" "xorg-x11-drv*" || true
          changed_when: true

        - name: 9a-FollowUp-A. Protect core system packages from accidental dependency removal
          ansible.builtin.package:
            name:
              - NetworkManager
              - openssh-server
              - openssh-clients
              - curl
              - tar
            state: present

        - name: 9b-FollowUp-B. Sweep away orphaned legacy graphic dependencies
          ansible.builtin.shell: dnf autoremove -y
          changed_when: true

        # =========================================================================
        # PRE-UPGRADE ANALYSIS & TARGETED SECTOR PURGES
        # =========================================================================
        - name: 10. Remove custom overridden data files
          ansible.builtin.file:
            path: /etc/leapp/files/device_driver_deprecation_data.json
            state: absent

        - name: 11. Force reinstall official leapp data packages to restore original streams
          ansible.builtin.shell: "dnf reinstall -y leapp-upgrade leapp-data-almalinux"
          become: true

        # =========================================================================
        # REMEDIATION & PRE-UPGRADE ANALYSIS
        # =========================================================================
        - name: 12a. Copy remediation engine script onto guest filesystem
          ansible.builtin.copy:
            src: scripts/leapp_auto_remediate.sh
            dest: /tmp/leapp_auto_remediate.sh
            mode: "0755"

        - name: 12b. Force run remediation script natively to fix environment configurations
          ansible.builtin.shell: "/tmp/leapp_auto_remediate.sh"
          become: true
          ignore_errors: true

        - name: 12c. Clean up the script file from guest
          ansible.builtin.file:
            path: /tmp/leapp_auto_remediate.sh
            state: absent

        - name: 13a. Run Leapp pre-upgrade analysis
          ansible.builtin.command: /bin/leapp preupgrade
          environment:
            LEAPP_UNSUPPORTED: "1"
            LEAPP_DEVEL_TARGET_PRODUCT: "AlmaLinux"
            LEAPP_TARGET_PRODUCT_VERSION: "10"
          register: preupgrade_result
          ignore_errors: true
          changed_when: false

        - name: 13b. Display pre-upgrade scan console output metrics
          ansible.builtin.debug:
            msg: "{{ (preupgrade_result.stdout | regex_search('(?s)(Debug output written to.*|UPGRADE INHIBITORS.*)') | default('Summary block not found.', true)).split('\n') }}"

        - name: 13c. Check if pre-upgrade failed due to critical inhibitors
          ansible.builtin.fail:
            msg: >
              Leapp pre-upgrade failed due to a hard inhibitor blocker!
              Review /var/log/leapp/leapp-report.txt on the remote host.
              ---------------------------------------------------------
              STDOUT PAYLOAD: {{ preupgrade_result.stdout }}
              STDERR PAYLOAD: {{ preupgrade_result.stderr }}
          when: >
            (preupgrade_result.stdout is search('UPGRADE INHIBITED')) or
            (preupgrade_result.stderr is search('UPGRADE INHIBITED')) or
            (preupgrade_result.stdout is search('inhibitor: yes')) or
            (preupgrade_result.stderr is search('inhibitor: yes'))

        # =========================================================================
        # TRANSACTION EXECUTION ENGINE
        # =========================================================================
        - name: 14a. Trigger the ELevate upgrade synchronously
          ansible.builtin.command: /bin/leapp upgrade
          environment:
            LEAPP_UNSUPPORTED: "1"
            LEAPP_DEVEL_TARGET_PRODUCT: "AlmaLinux"
            LEAPP_TARGET_PRODUCT_VERSION: "{{ upgrade_target_major }}" 
          register: leapp_upgrade_result
          changed_when: true

        - name: 14b. Initiate migration reboot and wait for AlmaLinux 10 conversion
          ansible.builtin.reboot:
            reboot_timeout: 2700  
            connect_timeout: 30
            msg: "Ansible initiating controlled ELevate transaction upgrade reboot."

        # =========================================================================
        #  POST-UPGRADE VALIDATION ENGINE
        # =========================================================================
        - name: 15a. Force Ansible to refresh system information
          ansible.builtin.setup:
          vars:
            ansible_python_interpreter: /usr/bin/python3
          tags: latest
          
        - name: 15b Validate that the system has successfully upgraded to major version 10
          ansible.builtin.assert:
            that:
              - ansible_distribution == "AlmaLinux"
              - ansible_distribution_major_version == upgrade_target_major
            fail_msg: "Upgrade validation failed! System is reporting version {{ ansible_distribution_version }} instead of AlmaLinux 10."
            success_msg: "Success! Verified target machine is now actively running {{ ansible_distribution_version }}."
          tags: latest